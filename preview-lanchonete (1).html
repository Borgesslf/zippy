.preview-ribbon{position:fixed;right:13px;top:10px;z-index:80;background:#e9d6ad;color:#294335;border-radius:30px;padding:7px 13px;font-size:10px;letter-spacing:.03em;font-weight:800;box-shadow:0 2px 12px #0002;pointer-events:none}.logo-glyph{font-size:22px;line-height:1}.nav-ico{display:inline-flex;width:20px;font-size:19px;justify-content:center}.sale-intro{padding:14px;background:#f0f7f1;border-radius:10px;margin-top:14px;font-size:12px;color:#5a7762}.sale-intro b{color:#1b503b}.status{padding:5px 8px;border-radius:30px;font-size:10px;font-weight:750}.status-pending{background:#fff0df;color:#a7783f}.status-paid{background:#e7f5eb;color:#28774c}.toast{display:none}.toast.show{display:flex}.preview-help{font-size:11px;color:#829588;margin-top:10px}.s-cond{color:#698172;font-size:12px}.fake-link{font-size:11px;color:#54836a;border:0;background:none;font-weight:700;cursor:pointer}.preview-modal-text{white-space:pre-line;font-size:12px;line-height:1.7;background:#f4f7f2;border-radius:12px;padding:15px;max-height:50vh;overflow:auto;margin-bottom:14px}.mini-row{display:flex;justify-content:space-between;gap:12px;margin-bottom:9px;font-size:12px}.display-mobile{display:none}.muted-chip{background:#edf4eb;color:#427454;border-radius:30px;padding:6px 10px;font-size:11px;font-weight:700}.alert-hint{font-size:11px;line-height:1.5;color:#8ca092}.view-root{min-height:400px}.cart-empty{color:#839889;font-size:12px;line-height:1.5;padding:30px 10px;text-align:center}.account-row{cursor:pointer}.nav-link:focus-visible,.btn:focus-visible{outline:2px solid #eacf9e}.preview-ribbon{top:11px}
@media(max-width:640px){.preview-ribbon{top:72px;right:9px;padding:5px 9px;font-size:9px}.history-products{max-width:100%}.panel{padding:16px}.login-btn{display:none}}
</style></head><body>
<div class="preview-ribbon">PRÉVIA COM DADOS FICTÍCIOS</div>
<div class="app-shell">
<aside class="sidebar"><div class="sidebar-brand"><div class="brand-logo"><span class="logo-glyph">▤</span></div><div><strong>Lanchonete</strong><small>Gestão de contas</small></div></div><div class="sidebar-label">MENU PRINCIPAL</div><nav class="sidebar-nav" id="desktop-nav"></nav><div class="sidebar-bottom"><div class="current-user"><div class="mini-avatar">A</div><div><strong>Administrador</strong><small>Administrador</small></div></div><button class="nav-link" onclick="showToast('Esta é uma prévia. O login será feito após conectar o Supabase.')"><span class="nav-ico">↪</span>Sair da conta</button></div></aside>
<main class="workspace"><div class="mobile-topbar"><div class="sidebar-brand"><div class="brand-logo brand-logo-small"><span class="logo-glyph">▤</span></div><div><strong>Lanchonete</strong><small>Administrador</small></div></div><span style="font-size:20px;color:#d4dece">☰</span></div><div class="workspace-content"><div class="view-root" id="view"></div></div></main>
<nav class="mobile-nav" id="mobile-nav"></nav></div>
<div id="toast" class="toast success" role="status">✓ <span id="toast-txt"></span></div>
<div id="modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal-content"></div></div>
<script>
const icons={dashboard:'▦',sale:'▣',clients:'♙',products:'□',settings:'⚙'};
const tabs=[['sale','Registrar consumo'],['dashboard','Visão geral'],['clients','Clientes'],['products','Cardápio'],['settings','Configurações']];
const products=[{name:'Almoço',price:2300},{name:'KitKat',price:600},{name:'Refrigerante',price:500},{name:'Suco natural',price:700},{name:'Café',price:700},{name:'Salgado',price:800}];
const clients=[{name:'João Silva',phone:'(13) 99999-1234',paid:2500,entries:[{date:'13/10/2026 às 12:41',items:[['Almoço',2300,1],['KitKat',600,1],['Refrigerante',500,1]]},{date:'12/10/2026 às 13:05',items:[['Almoço',2300,1],['Suco natural',700,1]]},{date:'10/10/2026 às 12:18',items:[['Almoço',2300,1],['KitKat',600,1],['Café',700,1]]},{date:'08/10/2026 às 12:22',items:[['Refeição',2000,1]]}],payments:[{date:'12/10/2026 às 16:02',value:2500,method:'Pix'}]},
{name:'Maria Oliveira',phone:'(13) 99999-0000',paid:0,entries:[{date:'12/10/2026 às 12:08',items:[['Almoço',2300,2],['KitKat',600,1],['Refrigerante',500,1]]}],payments:[]},
{name:'Carlos Santos',phone:'(13) 98888-0000',paid:0,entries:[{date:'13/10/2026 às 13:10',items:[['Almoço',2300,1],['KitKat',600,1],['Refrigerante',500,1]]}],payments:[]},
{name:'Ana Souza',phone:'(13) 97777-0000',paid:2300,entries:[{date:'11/10/2026 às 12:43',items:[['Almoço',2300,1]]}],payments:[{date:'11/10/2026 às 17:00',value:2300,method:'Pix'}]}];
let page='dashboard', opened=0, cart=[], customer=0, historyFilter='all', clientFilter='', pendingOnly=false;
const brl=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const totalSale=e=>e.items.reduce((s,i)=>s+i[1]*i[2],0);
const consumed=c=>c.entries.reduce((s,e)=>s+totalSale(e),0);
const due=c=>consumed(c)-c.paid;
const total=()=>clients.reduce((s,c)=>s+Math.max(0,due(c)),0);
const title=(label,head,desc,action='')=>`<header class="section-heading"><div><p class="eyebrow">${label}</p><h1>${head}</h1><p class="text-muted">${desc}</p></div>${action?`<div class="section-actions">${action}</div>`:''}</header>`;
function navigate(p){page=p;render(); window.scrollTo({top:0,behavior:'instant'});}
function showToast(s){const t=document.getElementById('toast');document.getElementById('toast-txt').textContent=s;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),3000)}
function updateNav(){document.getElementById('desktop-nav').innerHTML=tabs.map(([k,t])=>`<button class="nav-link ${page===k || (page==='statement' && k==='dashboard')?'active':''}" onclick="navigate('${k}')"><span class="nav-ico">${icons[k]}</span><span>${t}</span></button>`).join('');document.getElementById('mobile-nav').innerHTML=tabs.map(([k,t])=>`<button class="${page===k || (page==='statement' && k==='dashboard')?'active':''}" onclick="navigate('${k}')"><span style="font-size:20px">${icons[k]}</span><span>${({sale:'Registrar',dashboard:'Início',clients:'Clientes',products:'Cardápio',settings:'Ajustes'})[k]}</span></button>`).join('')}
function render(){updateNav();const el=document.getElementById('view'); el.innerHTML=page==='dashboard'?dashboard():page==='sale'?sale():page==='statement'?statement():page==='clients'?clientsView():page==='products'?productsView():settingsView()}
function dashboard(){let matching=clients.map((c,i)=>({...c,i})).filter(c=>c.name.toLowerCase().includes(clientFilter.toLowerCase())&&(!pendingOnly||due(c)>0));return `${title('VISÃO GERAL','Painel administrativo','Acompanhe as contas e os pagamentos da lanchonete.','<button class="btn btn-outline" onclick="showToast(\'Dados demonstrativos atualizados!\')">↻ Atualizar</button>')}
<div class="stats-grid"><div class="stat-card primary-stat"><div class="stat-icon">▱</div><span>Valor a receber</span><strong>${brl(total())}</strong><small>Soma das contas em aberto</small></div><div class="stat-card"><div class="stat-icon">▣</div><span>Contas em aberto</span><strong>${clients.filter(c=>due(c)>0).length}</strong><small>Clientes com saldo pendente</small></div><div class="stat-card"><div class="stat-icon">♙</div><span>Clientes cadastrados</span><strong>${clients.length}</strong><small>Ativos e inativos</small></div></div>
<div class="panel"><div class="list-heading"><div><h2>Contas dos clientes</h2><p class="text-muted">Consulte o histórico, registre pagamentos ou envie cobranças.</p></div><button class="btn btn-soft" onclick="navigate('clients')">＋ Novo cliente</button></div><div class="filters"><div class="search-input"><input id="filter" placeholder="Pesquisar pelo nome..." oninput="clientFilter=this.value;drawAccounts()" value="${esc(clientFilter)}"></div><label class="check-filter"><input type="checkbox" onchange="pendingOnly=this.checked;drawAccounts()" ${pendingOnly?'checked':''}/> Apenas pendentes</label></div><div class="account-list" id="accounts">${accountsHTML(matching)}</div></div>`}
function drawAccounts(){let matching=clients.map((c,i)=>({...c,i})).filter(c=>c.name.toLowerCase().includes(clientFilter.toLowerCase())&&(!pendingOnly||due(c)>0));document.getElementById('accounts').innerHTML=accountsHTML(matching)}
function accountsHTML(arr){return arr.map(c=>`<button class="account-row" onclick="openClient(${c.i})"><div class="avatar">${c.name[0]}</div><div class="account-info"><strong>${esc(c.name)}</strong><small>Último movimento: 13/10/2026</small></div><div class="account-amount"><strong>${brl(due(c))}</strong><span class="status ${due(c)>0?'status-pending':'status-paid'}">${due(c)>0?'Pendente':'Em dia'}</span></div><span class="row-chevron">›</span></button>`).join('')||'<p class="text-muted">Nenhum cliente encontrado.</p>'}
function openClient(i){opened=i;historyFilter='all';navigate('statement')}
function statement(){const c=clients[opened];const entries=[...c.entries.map(e=>({...e,type:'sale'})),...c.payments.map(e=>({...e,type:'payment'}))].filter(e=>historyFilter==='all'||e.type===historyFilter);return `<button class="back-button" onclick="navigate('dashboard')">← Voltar para as contas</button>${title('EXTRATO DO CLIENTE',esc(c.name),esc(c.phone),'<button class="btn btn-outline" onclick="showToast(\'Extrato atualizado\')">↻ Atualizar</button>')}
<div class="statement-cards"><div class="statement-balance"><span>SALDO EM ABERTO</span><strong>${brl(due(c))}</strong><small>${due(c)>0?'Aguardando pagamento':'Nenhuma pendência no momento'}</small></div><div class="statement-metrics"><div><span>Total consumido</span><strong>${brl(consumed(c))}</strong></div><div><span>Total pago</span><strong>${brl(c.paid)}</strong></div></div></div>
<div class="statement-actions"><button class="btn btn-primary" onclick="paymentModal()" ${due(c)<=0?'disabled':''}>▣ Registrar pagamento</button><button class="btn btn-whatsapp" onclick="chargeModal()" ${due(c)<=0?'disabled':''}>◉ Cobrar pelo WhatsApp</button><button class="btn btn-outline" onclick="copyCharge()">▤ Copiar cobrança</button></div>
<div class="panel statement-history"><div class="list-heading"><div><h2>Histórico da conta</h2><p class="text-muted">Todos os registros ficam disponíveis para consulta.</p></div><span class="history-mark">◷ ${c.entries.length+c.payments.length} registros</span></div><div class="tab-row"><button class="${historyFilter==='all'?'active':''}" onclick="historyFilter='all';render()">Tudo</button><button class="${historyFilter==='sale'?'active':''}" onclick="historyFilter='sale';render()">Consumos</button><button class="${historyFilter==='payment'?'active':''}" onclick="historyFilter='payment';render()">Pagamentos</button></div><div class="timeline">${entries.map(e=>e.type==='sale'?`<div class="history-entry"><div class="history-symbol sale-symbol">▣</div><div class="history-body"><div class="history-top"><div><strong>Consumo registrado</strong><small>${esc(e.date)}</small></div><strong class="negative-value">+ ${brl(totalSale(e))}</strong></div><div class="history-products">${e.items.map(i=>`<div><span>${i[2]}× ${esc(i[0])}</span><span>${brl(i[1]*i[2])}</span></div>`).join('')}</div><button class="text-action danger" onclick="showToast('Cancelamentos estarão disponíveis na versão conectada ao banco.')">▤ Cancelar lançamento</button></div></div>`:`<div class="history-entry"><div class="history-symbol payment-symbol">✓</div><div class="history-body"><div class="history-top"><div><strong>Pagamento recebido</strong><small>${esc(e.date)} · ${esc(e.method)}</small></div><strong class="positive-value">− ${brl(e.value)}</strong></div></div></div>`).join('')}</div></div>`}
function sale(){return `${title('ATENDIMENTO','Registrar consumo','Escolha o cliente e adicione os produtos. A data e a hora são registradas automaticamente.')}
<div class="sale-grid"><div class="main-stack"><section class="panel"><div class="panel-head"><span class="step">01</span><div><h2>Qual é o cliente?</h2><p class="text-muted">Selecione a conta que receberá o consumo.</p></div></div><label class="input-label">Cliente<select onchange="customer=+this.value;render()">${clients.map((c,i)=>`<option value="${i}" ${i===customer?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label></section><section class="panel"><div class="panel-head"><span class="step">02</span><div><h2>Adicionar produtos</h2><p class="text-muted">Toque em um produto para colocá-lo na conta.</p></div></div><div class="search-input"><input id="product-search" placeholder="Procurar no cardápio..." oninput="filterProducts(this.value)"></div><div class="product-grid" id="product-grid">${productHTML('')}</div><div class="custom-product"><h3>Produto avulso</h3><div class="custom-fields"><input id="custom-name" placeholder="Ex.: Suco de laranja"><input id="custom-price" placeholder="R$ 7,50" inputmode="decimal"><button class="btn btn-outline" onclick="customProduct()">＋ Adicionar</button></div></div></section></div>
<aside class="panel cart-panel"><div class="cart-header"><div><span class="eyebrow">CONFERÊNCIA</span><h2>Consumo atual</h2></div><div class="cart-count">${cart.reduce((s,i)=>s+i.q,0)}</div></div><div class="chosen-client">♙ ${esc(clients[customer].name)}</div>${cart.length?`<div class="cart-lines">${cart.map((i,j)=>`<div class="cart-line"><div class="cart-line-top"><strong>${esc(i.name)}</strong><span>${brl(i.price*i.q)}</span></div><div class="cart-bottom"><span>${brl(i.price)} / un.</span><div class="qty"><button onclick="qty(${j},-1)">−</button><span>${i.q}</span><button onclick="qty(${j},1)">＋</button></div></div></div>`).join('')}</div>`:'<div class="cart-empty">Adicione produtos do cardápio para começar este consumo.</div>'}<div class="cart-footer"><div class="cart-total"><span>Total do consumo</span><strong>${brl(cart.reduce((s,i)=>s+i.price*i.q,0))}</strong></div><button class="btn btn-primary btn-block" ${!cart.length?'disabled':''} onclick="saveSale()">✓ Salvar consumo na conta</button><p class="hint center">Prévia demonstrativa. Nenhum dado real será registrado.</p></div></aside></div>`}
function productHTML(v){return products.filter(p=>p.name.toLowerCase().includes(v.toLowerCase())).map(p=>`<button class="product-tile" onclick="addProduct('${p.name}',${p.price})"><span>${p.name}</span><div><strong>${brl(p.price)}</strong><span class="tile-plus">＋</span></div></button>`).join('')}
function filterProducts(v){document.getElementById('product-grid').innerHTML=productHTML(v)}
function addProduct(n,p){const item=cart.find(i=>i.name===n&&i.price===p);if(item)item.q++;else cart.push({name:n,price:p,q:1});render()}
function qty(i,v){cart[i].q+=v;if(cart[i].q<=0)cart.splice(i,1);render()}
function customProduct(){const n=document.getElementById('custom-name').value.trim();let p=document.getElementById('custom-price').value.trim().replace('R$','').replace(/\./g,'').replace(',','.');p=Math.round(parseFloat(p)*100);if(!n||!(p>0))return showToast('Informe nome e preço válidos.');addProduct(n,p)}
function saveSale(){if(!cart.length)return;clients[customer].entries.unshift({date:'13/10/2026 às 13:40',items:cart.map(i=>[i.name,i.price,i.q])});cart=[];showToast('Consumo registrado nos dados fictícios!');openClient(customer)}
function chargeMessage(){const c=clients[opened];return `Olá, ${c.name.split(' ')[0]}! Tudo bem?\n\nSegue o resumo do seu consumo na lanchonete:\n\n${c.entries.map(e=>`${e.date.split(' às ')[0]}\n${e.items.map(i=>`• ${i[2]}× ${i[0]} — ${brl(i[1]*i[2])}`).join('\n')}`).join('\n\n')}\n\nTotal consumido: ${brl(consumed(c))}\nTotal pago: ${brl(c.paid)}\nVALOR EM ABERTO: ${brl(due(c))}\n\nPagamento via Pix:\n[CHAVE PIX DA LANCHONETE]`}
function chargeModal(){document.getElementById('modal-content').innerHTML=`<div class="modal-head"><div><p class="eyebrow">COBRANÇA</p><h2>Mensagem pronta para o WhatsApp</h2></div><button class="icon-button" onclick="closeModal()">✕</button></div><div class="preview-modal-text">${esc(chargeMessage())}</div><p class="preview-help">No aplicativo conectado, este botão abrirá o WhatsApp do cliente. Nesta prévia, a cobrança não é enviada.</p><button class="btn btn-whatsapp btn-block" onclick="copyCharge()">▣ Copiar mensagem</button>`;document.getElementById('modal').style.display='flex'}
async function copyCharge(){try{await navigator.clipboard.writeText(chargeMessage());showToast('Mensagem de cobrança copiada!')}catch(e){showToast('Abra o preview em HTTPS para copiar a mensagem.')}}
function paymentModal(){const c=clients[opened];document.getElementById('modal-content').innerHTML=`<div class="modal-head"><div><p class="eyebrow">QUITAÇÃO</p><h2>Registrar pagamento</h2></div><button class="icon-button" onclick="closeModal()">✕</button></div><div class="form-stack"><div class="alert info">Saldo atual: <b>${brl(due(c))}</b></div><label>Valor recebido (R$)<input id="pay-input" value="${(due(c)/100).toFixed(2).replace('.',',')}" inputmode="decimal"></label><label>Forma de pagamento<select id="pay-method"><option>Pix</option><option>Dinheiro</option><option>Cartão</option></select></label><button class="btn btn-primary btn-block" onclick="confirmPayment()">✓ Confirmar pagamento</button><p class="hint">Este pagamento será registrado apenas na simulação.</p></div>`;document.getElementById('modal').style.display='flex'}
function confirmPayment(){const c=clients[opened];let val=Math.round(parseFloat(document.getElementById('pay-input').value.replace(',','.'))*100);if(!(val>0)||val>due(c))return showToast('Informe valor maior que zero até o saldo disponível.');c.paid+=val;c.payments.unshift({date:'13/10/2026 às 13:40',value:val,method:document.getElementById('pay-method').value});closeModal();render();showToast('Pagamento registrado na simulação!')}
function closeModal(){document.getElementById('modal').style.display='none'}
function clientsView(){return `${title('ADMINISTRAÇÃO','Clientes','Cadastre pessoas, telefones e mantenha a lista organizada.') }<div class="management-grid"><div class="panel"><h2>Novo cliente</h2><p class="text-muted">O WhatsApp será utilizado para enviar a cobrança.</p><div class="form-stack"><label>Nome completo<input id="new-client" placeholder="Ex.: João Silva"></label><label>WhatsApp com DDD<input id="new-phone" placeholder="(13) 99999-9999"></label><button class="btn btn-primary btn-block" onclick="newClient()">＋ Cadastrar cliente</button></div></div><div class="panel"><h2>Clientes cadastrados</h2><p class="text-muted">${clients.length} pessoa(s)</p><div class="manage-list">${clients.map((c,i)=>`<div class="manage-row"><div class="avatar">${c.name[0]}</div><div class="manage-info"><strong>${esc(c.name)}</strong><small>${esc(c.phone)}</small></div><button class="fake-link" onclick="openClient(${i})">Ver conta</button></div>`).join('')}</div></div></div>`}
function newClient(){const name=document.getElementById('new-client').value.trim(),phone=document.getElementById('new-phone').value.trim();if(!name)return showToast('Digite o nome do cliente.');clients.push({name,phone,paid:0,entries:[],payments:[]});render();showToast('Cliente adicionado à simulação!')}
function productsView(){return `${title('ADMINISTRAÇÃO','Cardápio','Defina produtos e preços. Os valores antigos permanecem preservados.') }<div class="management-grid"><div class="panel"><h2>Novo produto</h2><div class="form-stack"><label>Nome do produto<input id="new-product" placeholder="Ex.: Bolo de pote"></label><label>Preço (R$)<input id="new-product-price" placeholder="Ex.: 12,00"></label><button class="btn btn-primary btn-block" onclick="newProduct()">＋ Adicionar produto</button></div></div><div class="panel"><h2>Produtos cadastrados</h2><div class="manage-list">${products.map(p=>`<div class="manage-row"><div class="product-icon">□</div><div class="manage-info"><strong>${p.name}</strong><small>${brl(p.price)}</small></div></div>`).join('')}</div></div></div>`}
function newProduct(){const n=document.getElementById('new-product').value.trim();const p=Math.round(parseFloat(document.getElementById('new-product-price').value.replace(',','.'))*100);if(!n||!(p>0))return showToast('Informe nome e preço.');products.push({name:n,price:p});render();showToast('Produto adicionado à simulação!')}
function settingsView(){return `${title('ADMINISTRAÇÃO','Configurações','Defina os dados que aparecerão na mensagem de cobrança.') }<div class="panel settings-panel"><h2>Dados da lanchonete</h2><div class="form-stack"><label>Nome da lanchonete<input value="Lanchonete" /></label><label>Chave Pix<input value="[CHAVE PIX DA LANCHONETE]" /></label><label>Nome do recebedor (opcional)<input placeholder="Nome que aparecerá na cobrança" /></label><div class="alert info">Nesta prévia, as configurações não são persistidas.</div><button class="btn btn-primary" onclick="showToast('As configurações estarão disponíveis após conectar o Supabase.')">✓ Salvar configurações</button></div></div>`}
render();
</script></body></html>
